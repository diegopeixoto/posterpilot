name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2'
      - run: bun install --frozen-lockfile
      - run: bun run check
      # `test` includes the component project, which runs in a real browser:
      # focus, activeElement and pointer capture are exactly what those
      # components get wrong, and an emulated DOM models them least faithfully.
      # Chromium only — the full Playwright E2E suite stays a local gate.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
      - run: bun run lint

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: posterpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
